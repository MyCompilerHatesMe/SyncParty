<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Intermediate Wrapper Iframe</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    .bar {
      height: 28px;
      background: #1e293b;
      color: #94a3b8;
      font-size: 11px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border-bottom: 1px solid #334155;
    }
    iframe {
      width: 100%;
      height: calc(100% - 28px);
      border: 0;
    }
  </style>
</head>
<body>
  <div class="bar">MIDDLE WRAPPER IFRAME (depth = 1) &rarr; embeds leaf player iframe below</div>
  <iframe src="./iframe-player.html" allow="autoplay; fullscreen"></iframe>
</body>
</html>
